<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src http: https: blob:; connect-src http: https:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">

    <title>Vistivo TV</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- =========================================================
     LOGIN
     ========================================================= -->

<div id="loginScreen" class="screen hidden">

    <div class="loginBox">

        <img class="loginBrandBanner" src="images/vistivo-banner.png" alt="Vistivo TV">

        <div class="loginSubtitle">
            Sign in to your Immich server
        </div>

        <label>Server</label>

        <input
            id="serverInput"
            type="text">

        <label>Email</label>

        <input
            id="emailInput"
            type="email"
            autocomplete="username">

        <label>Password</label>

        <input
            id="passwordInput"
            type="password"
            autocomplete="current-password">

        <button id="loginButton">
            SIGN IN
        </button>

        <div id="loginStatus"></div>

        <div id="securityNotice" class="securityNotice hidden"></div>

    </div>

</div>


<!-- =========================================================
     PROFILES
     ========================================================= -->

<div id="profileScreen" class="screen hidden">

    <div class="profilePanel">
        <img class="loginBrandBanner" src="images/vistivo-banner.png" alt="Vistivo TV">
        <div class="loginSubtitle">Who is watching?</div>
        <div id="profileList"></div>
        <div class="profileHint">Use Left/Right and press Enter</div>
    </div>

</div>


<!-- =========================================================
     GALLERY
     ========================================================= -->

<div id="galleryScreen" class="screen hidden">

    <header id="topBar">

        <div class="brand">
            <img class="brandBanner" src="images/vistivo-banner.png" alt="Vistivo TV">
        </div>

        <div class="topRight">

            <button id="userName" type="button"></button>

            <button
                id="settingsButton"
                class="iconButton"
                aria-label="Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.18.59-1.69.98l-2.49-1a.49.49 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.07.66-.07.98s.03.66.07.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.38.3.61.22l2.49-1c.51.4 1.08.73 1.69.98l.38 2.65c.04.24.24.42.49.42h4c.25 0 .45-.18.49-.42l.38-2.65c.61-.25 1.18-.58 1.69-.98l2.49 1c.23.08.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/>
                </svg>
            </button>

        </div>

    </header>


    <div id="galleryArea">

        <main id="galleryContainer">

            <div id="gallery"></div>

            <div id="loadingMore">
                Loading...
            </div>

        </main>


        <!-- DATE RAIL -->

        <aside id="dateRail">

            <div class="railTitle">
                TIMELINE
            </div>

            <div id="dateRailItems"></div>

        </aside>

    </div>

</div>


<!-- =========================================================
     VIEWER
     ========================================================= -->

<div id="viewerScreen" class="screen hidden">

    <div id="viewerLoading">
        Loading...
    </div>

    <img id="viewerImage">

    <video id="viewerVideo" preload="metadata" playsinline></video>

    <div id="videoControls" class="videoControls hidden">
        <div id="videoProgress" class="videoProgress"><div id="videoProgressFill"></div></div>
        <div class="videoControlRow">
            <span id="videoCurrentTime">0:00</span>
            <div class="transportButtons">
                <button class="transportButton rewindButton" data-video-action="rewind" aria-label="Rewind 10 seconds"><i></i></button>
                <button class="transportButton playButton" data-video-action="toggle" aria-label="Play"><i></i></button>
                <button class="transportButton stopButton" data-video-action="stop" aria-label="Stop"><i></i></button>
                <button class="transportButton forwardButton" data-video-action="forward" aria-label="Forward 10 seconds"><i></i></button>
            </div>
            <span id="videoDuration">0:00</span>
        </div>
    </div>

    <div id="viewerInfo">

        <div id="viewerDate"></div>

        <div id="viewerCounter"></div>

    </div>

    <div id="viewerSlideshow">
        Press Enter for slideshow
    </div>

</div>


<!-- =========================================================
     SETTINGS
     ========================================================= -->

<div id="settingsScreen" class="overlay hidden">

    <div class="settingsPanel">

        <div class="settingsHeader">

            <h1>Settings</h1>

            <button
                id="settingsClose"
                class="iconButton">
                ✕
            </button>

        </div>


        <div class="settingSection">

            <h2>Gallery</h2>

            <div class="settingRow">

                <div>
                    Columns
                </div>

                <div
                    id="columnOptions"
                    class="optionGroup">

                    <button data-columns="4">
                        4
                    </button>

                    <button data-columns="5">
                        5
                    </button>

                    <button data-columns="6">
                        6
                    </button>

                    <button data-columns="7">
                        7
                    </button>

                    <button data-columns="8">
                        8
                    </button>

                </div>

            </div>

        </div>


        <div class="settingSection">

            <h2>Slideshow</h2>

            <div class="settingRow">

                <div>
                    Interval
                </div>

                <select id="slideshowInterval">

                    <option value="3">
                        3 seconds
                    </option>

                    <option value="5">
                        5 seconds
                    </option>

                    <option value="10">
                        10 seconds
                    </option>

                    <option value="15">
                        15 seconds
                    </option>

                </select>

            </div>

        </div>


        <div class="settingSection">

            <h2>Account</h2>

            <div id="settingsUser"></div>

            <button
                id="switchProfileButton"
                class="secondaryButton">
                Switch profile
            </button>

            <button
                id="logoutButton"
                class="dangerButton">
                Sign out
            </button>

            <button
                id="removeProfileButton"
                class="dangerButton">
                Remove profile from this TV
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     ERROR
     ========================================================= -->

<div id="errorBox" class="hidden"></div>

<div id="networkOverlay" class="systemOverlay hidden">
    <div class="systemDialog">
        <h1>No network connection</h1>
        <p>Reconnect the TV to the network, then try again.</p>
        <button id="networkRetryButton">RETRY</button>
    </div>
</div>

<div id="exitOverlay" class="systemOverlay hidden">
    <div class="systemDialog">
        <h1>Exit Vistivo TV?</h1>
        <div class="dialogActions">
            <button id="exitNoButton">NO</button>
            <button id="exitYesButton">YES</button>
        </div>
    </div>
</div>

<div id="accountConfirmOverlay" class="systemOverlay hidden">
    <div class="systemDialog">
        <h1 id="accountConfirmTitle"></h1>
        <p id="accountConfirmText"></p>
        <div class="dialogActions">
            <button id="accountConfirmNoButton">NO</button>
            <button id="accountConfirmYesButton" class="confirmDangerButton">YES</button>
        </div>
    </div>
</div>


<script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
<script src="js/main.js"></script>

</body>
</html>
